<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TMI Ops</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --blue:#0179C2; --blue-strong:#015A92; --tint:rgba(1,121,194,.10); --tint2:rgba(1,121,194,.22);
  --text:#1A1A1A; --muted:#5B6670; --paper:#F3F5F7; --surface:#FFFFFF; --soft:#EAEEF2; --line:#D6DCE2;
  --yellow:#F2B705; --red:#C8372D; --red-tint:rgba(200,55,45,.10); --green:#2E7D4F; --stripe-dark:#1A1A1A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --blue:#3AA2E4; --blue-strong:#8CCBF3; --tint:rgba(58,162,228,.14); --tint2:rgba(58,162,228,.30);
    --text:#E7ECF0; --muted:#9AA7B2; --paper:#11161B; --surface:#192028; --soft:#212A33; --line:#2D3742;
    --red:#E8695E; --red-tint:rgba(232,105,94,.14); --green:#5DBA86; --stripe-dark:#0B0F12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --blue:#3AA2E4; --blue-strong:#8CCBF3; --tint:rgba(58,162,228,.14); --tint2:rgba(58,162,228,.30);
  --text:#E7ECF0; --muted:#9AA7B2; --paper:#11161B; --surface:#192028; --soft:#212A33; --line:#2D3742;
  --red:#E8695E; --red-tint:rgba(232,105,94,.14); --green:#5DBA86; --stripe-dark:#0B0F12;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--text);font-family:Calibri,Carlito,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* Top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{background:#0179C2;color:#fff;font-weight:700;font-size:17px;padding:4px 9px;letter-spacing:.06em}
.brand b{font-size:18px}
.brand small{color:var(--muted);font-size:13px;display:block;margin-top:-2px}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.who select{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--text)}
.bell{position:relative;background:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
.bell .ct{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;font-weight:700}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;color:var(--muted)}
nav.tabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:600}
nav.tabs button[aria-current="page"]{color:var(--text);border-bottom-color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

main{max-width:1280px;margin:0 auto;padding:20px 18px 60px}
h1{font-size:26px;line-height:1.15;margin:0 0 4px}
h2{font-size:18px;margin:28px 0 10px}
.lead{color:var(--muted);margin:0 0 18px;max-width:72ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}

/* Hazard stripe: the one loud element. Means "over capacity". */
.hazard{background:repeating-linear-gradient(-45deg,var(--yellow) 0 7px,var(--stripe-dark) 7px 14px)}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{padding:14px 16px;border-left:1px solid var(--line);position:relative}
.kpi:first-child{border-left:0}
.kpi .v{font-size:28px;font-weight:700;line-height:1.1}
.kpi .v small{font-size:16px;font-weight:400;color:var(--muted)}
.kpi .l{color:var(--muted);font-size:13px}
.kpi.warn .v{color:var(--red)}
.kpi.warn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 6px,var(--stripe-dark) 6px 12px)}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi{border-top:1px solid var(--line)}.kpi:nth-child(odd){border-left:0}}
.chartbox{position:relative;height:260px}
.chartbox.sm{height:150px}

/* Lists */
.att{list-style:none;margin:0;padding:0}
.att li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.att li:first-child{border-top:0}
.tag{font-size:12px;font-weight:700;padding:1px 7px;border-radius:4px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.tag.red{background:var(--red-tint);color:var(--red)}
.tag.blue{background:var(--tint);color:var(--blue-strong)}
.tag.yel{background:rgba(242,183,5,.2);color:#8a6700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.yel{color:#F2C94C}}
:root[data-theme="dark"] .tag.yel{color:#F2C94C}
a.jl,button.jl{color:var(--blue-strong);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* Tables */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:600;background:var(--surface)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}

/* Schedule grid */
.sched th.wk{text-align:center;min-width:64px}
.sched th.wk.now{color:var(--blue-strong)}
.sched td.job,.sched th.job{position:sticky;left:0;background:var(--surface);z-index:1;border-right:1px solid var(--line);min-width:230px}
.sched td.job .c{font-weight:600}
.sched td.job .m{font-size:12px;color:var(--muted)}
.sched td.cell{text-align:center;padding:0;border-left:1px solid var(--soft);font-variant-numeric:tabular-nums}
.sched td.cell span,.sched td.cell input{display:block;width:100%;padding:8px 4px;text-align:center;border:0;background:transparent;font-variant-numeric:tabular-nums}
.sched td.cell input{-moz-appearance:textfield}
.sched td.cell input::-webkit-outer-spin-button,.sched td.cell input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sched td.cell.ov{box-shadow:inset 3px 0 0 var(--blue)}
.sched td.job.f-lock{border-left:6px solid var(--text)}
.sched td.job.f-conf{border-left:6px solid var(--blue)}
.sched td.job.f-wait{border-left:6px dashed var(--blue)}
.sched td.job.f-flex{border-left:6px solid color-mix(in srgb, var(--blue) 40%, transparent)}
.sched td.job.f-guess{border-left:6px dotted var(--muted)}
.sched td.job.f-fill{border-left:6px dotted var(--line)}
.sched tr.hrow td.cell{opacity:.4}
.legend i.fe{width:6px;height:16px;background:none!important}
.firmbar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--soft);margin:8px 0 10px}
.firmbar span{display:block;height:100%}
.firmkey{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 16px;font-size:13px}
.firmkey div{display:flex;align-items:center;gap:8px}
.firmkey i{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.sched tr.tot td{background:var(--soft);font-weight:600}
.sched tr.tot td.job{background:var(--soft)}
.sched td.cell.must{box-shadow:inset -3px 0 0 var(--red)}
.sched td.gap{position:relative;color:var(--red);font-weight:700}
.sched td.gap::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 6px,var(--stripe-dark) 6px 12px)}
.sched td.open{color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 0 0}
.legend i{display:inline-block;width:22px;height:10px;vertical-align:middle;margin-right:6px}

/* Forms */
.field{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--text);font-size:15px}
.field input:disabled,.field select:disabled{background:var(--soft);color:var(--muted)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:var(--soft);color:var(--text);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
td input.act{width:90px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-align:right}
td input.act.miss{border-color:var(--yellow)}
.banner{border-left:5px solid var(--green);background:var(--surface);border-radius:6px;padding:12px 14px;margin:0 0 16px;border:1px solid var(--line);border-left-width:5px;border-left-color:var(--green)}
.note{font-size:13px;color:var(--muted)}

/* Alerts feed (Teams-like cards) */
.feed{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:6px;padding:11px 13px}
.card.r-overrun,.card.r-gap{border-left-color:var(--red)}
.card.r-date{border-left-color:var(--yellow)}
.card.r-digest{border-left-color:var(--muted)}
.card .h{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.card .t{font-weight:700}
.card .when{font-size:12px;color:var(--muted);white-space:nowrap}
.card .b{margin:4px 0;white-space:pre-line}
.card .to{font-size:12px;color:var(--muted)}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}

dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--surface);color:var(--text);width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,14,18,.55)}
.dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.db{padding:16px 18px;overflow:auto}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:600px){.fg{grid-template-columns:1fr 1fr}}
.meter{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;position:relative;margin:4px 0 2px}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--blue)}
.meter i.r{background:var(--red)}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 14px}
@media (max-width:600px){.stat{grid-template-columns:1fr 1fr}}
.stat div b{display:block;font-size:20px}
.stat div{font-size:13px;color:var(--muted)}
.stat div b{color:var(--text)}
.board4{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.board4{grid-template-columns:1fr}}
.bm .big{font-size:30px;font-weight:700}
.bm .d{font-size:13px;color:var(--green);font-weight:600}
.bm .d.bad{color:var(--red)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.sched td.cell.verb{background:repeating-linear-gradient(45deg,var(--soft) 0 5px,transparent 5px 10px)!important;color:var(--muted)}
.sched td.cell.wint{outline:2px dashed var(--muted);outline-offset:-4px}
.sched tr.vrow td.job .c{color:var(--muted)}
tr.exc td{background:rgba(242,183,5,.12)}
.crewl{list-style:none;margin:0;padding:0}
.crewl li{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.crewl li:first-child{border-top:0}
.crewl .nm{min-width:150px;font-weight:600}
.q{font-size:12px;color:var(--muted)}
.confirm{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.chain{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chain li{flex:1 1 120px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;gap:2px;font-size:13px}
.chain li span{color:var(--muted);font-size:12px}
.chain li.done{border-color:var(--green)}
.chain li.done b::before{content:"\2713  ";color:var(--green)}
.chain li.cur{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.wodots{display:inline-flex;gap:4px;vertical-align:middle}
.wodots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);display:inline-block}
.wodots i.done{background:var(--green);border-color:var(--green)}
.wodots i.cur{border-color:var(--blue);background:var(--tint2)}
.tag.grn{background:color-mix(in srgb, var(--green) 15%, transparent);color:var(--green)}
.wobox{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:14px;background:var(--paper)}
.jyboard{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.jycol{background:var(--soft);border-radius:8px;padding:8px;min-height:140px}
.jycol h3{font-size:13px;margin:2px 4px 8px;display:flex;justify-content:space-between;gap:6px}
.jycol h3 span{color:var(--muted);font-weight:400}
.jycard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:6px;padding:8px 9px;margin-bottom:8px;cursor:pointer;color:var(--text);font:inherit;font-size:13px;line-height:1.35}
.jycard.late{border-left-color:var(--red)}
.jycard.soon{border-left-color:var(--yellow)}
.jycard b{display:block;font-size:14px}
.jycard .q{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.jycard .q.r{color:var(--red)}
.jymeter{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.jymeter i{display:block;height:100%;background:var(--green)}
.jyline{display:flex;gap:4px;margin:4px 0 12px;padding:0;list-style:none}
.jyline li{flex:1;font-size:11px;line-height:1.25;border-top:4px solid var(--line);padding-top:5px;color:var(--muted);min-width:0}
.jyline li.done{border-color:var(--green)}
.jyline li.cur{border-color:var(--blue);color:var(--text);font-weight:600}
.jyline li.late{border-color:var(--red);color:var(--text);font-weight:600}
.jylist{list-style:none;margin:0;padding:0}
.jylist li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.jylist li.sh{border-top:0;padding:10px 0 2px;font-weight:600;font-size:13px;color:var(--muted);display:block}
.jylist .q{display:block;font-size:12px;color:var(--muted)}
.jylist .ok{color:var(--green)}
.jylist .lt{color:var(--red);font-weight:600}
details.wobox summary{cursor:pointer;font-weight:600}
@media (max-width:640px){.jyline li{font-size:0}.jyline li.cur,.jyline li.late{font-size:11px}}
.wobox details summary{cursor:pointer}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand"><span class="mark">TMI</span><div><b>TMI Ops</b><small>v1 demo with sample data</small></div></div>
    <label class="who">Viewing as
      <select id="role"></select>
    </label>
    <button class="bell" id="bell" aria-label="Alerts">Alerts<span class="ct" id="bellct" hidden></span></button>
    <button class="ghost" id="reset" title="Restore the demo to its starting data">Reset demo</button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</header>
<main id="main"></main>
<dialog id="jobdlg"></dialog>

<script>
(function(){
"use strict";
/* ---------- utilities ---------- */
const DAY=864e5;
const D=s=>new Date(s+"T00:00:00Z");
const iso=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>iso(new Date(D(s).getTime()+n*DAY));
const mon=w=>addDays(w,-4);
const fmt=s=>D(s).toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"});
const fmtY=s=>D(s).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"});
const n0=v=>Math.round(v).toLocaleString("en-US");
const n1=v=>(Math.round(v*10)/10).toLocaleString("en-US");
const pct=v=>Math.round(v*100)+"%";
const usd=v=>v>=1e6?"$"+(v/1e6).toFixed(2)+"M":(v>=1e3?"$"+Math.round(v/1e3)+"K":"$"+Math.round(v));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const nowStamp=()=>{const d=new Date();return d.toLocaleDateString("en-US",{weekday:"short"})+" "+d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});};
const range=ws=>ws.length>1?fmt(ws[0])+"–"+fmt(ws[ws.length-1]):fmt(ws[0]);

/* ---------- constants ---------- */
const START_WEEK="2026-10-16";
const KEY="tmi-schedule2-demo-v15";
const QUALS=["Confined space","Lift","Fiberglass"];
const ROLES={
  admin:{name:"Austin Lewis",label:"Austin (admin)"},
  ops:{name:"Scheduler",label:"Scheduler"},
  lori:{name:"Lori",label:"Lori (job setup)"},
  est:{name:"Greg Halvorsen",label:"Estimator: Greg Halvorsen"},
  pm:{name:"PM JS",label:"PM JS",pm:"JS"},
  supt:{name:"Mike Ramirez",label:"Supt. Mike Ramirez"},
  crew:{name:"Crew member",label:"Crew member"},
  ceo:{name:"Derrick",label:"Derrick (CEO)"},
  acct:{name:"Accounting",label:"Accounting"},
  rep:{name:"Kelly Wright",label:"Rep: Kelly Wright"},
  board:{name:"Board member",label:"Board member"}
};
const RULES=[
  {id:"wo",name:"Work order",desc:"Draft ready, sign-offs, send-backs and late reviews"},
  {id:"bill",name:"Billing",desc:"Job complete and signed off, ready to invoice; late invoices"},
  {id:"open",name:"Open capacity",desc:"Unsold hours 4 to 8 weeks out, for the sales team"},
  {id:"date",name:"Date moved",desc:"Start or finish changes on any job"},
  {id:"overrun",name:"Overrun warning",desc:"Job on pace to beat its hours by the threshold"},
  {id:"crew",name:"Crew change",desc:"Crew size or leader changes"},
  {id:"gap",name:"Capacity gap",desc:"Men or leaders short in the next 8 weeks"},
  {id:"digest",name:"Monday digest",desc:"Week ahead, gaps, missing hours, accuracy"},
  {id:"cert",name:"Certification reminder",desc:"DOT physical or certification expiring in 60 or 30 days"}
];
const TABS=[
  {id:"me",label:"My week",roles:["crew","supt"]},
  {id:"dash",label:"Dashboard",roles:["admin","ops","ceo"]},
  {id:"sched",label:"Schedule",roles:["admin","ops","supt","ceo","rep","lori","est","pm","sched","acct"]},
  {id:"wo",label:"Work orders",roles:["admin","ops","ceo","lori","est","pm","sched","rep"]},
  {id:"jy",label:"Job journey",roles:["admin","ops","ceo","lori","est","pm","rep","acct"]},
  {id:"bill",label:"Billing",roles:["admin","ceo","acct"]},
  {id:"close",label:"Weekly close",roles:["admin","ops","ceo"]},
  {id:"rev",label:"Revenue",roles:["admin","ops","ceo","rep","acct"]},
  {id:"crew",label:"Crew",roles:["admin","ops","ceo"]},
  {id:"alerts",label:"Alerts and log",roles:["admin","ops","supt","crew","ceo","rep","lori","est","pm","sched","acct"]},
  {id:"lead",label:"Leader scorecard",roles:["admin","ops","ceo","supt"]},

function planFor(j){

function doClose(){
  const w=S.week, rows=closeRows(); let total=0, entered=0; const missing=[], completed=[];
  const before=S.alerts.length;
  rows.forEach(j=>{
    const v=document.querySelector(`[data-act="${j.id}"]`).value.trim();
    const done=document.querySelector(`[data-done="${j.id}"]`).checked;
    if(v===""){missing.push(j.id);} else {const h=Math.max(0,Math.round(+v));j.actual[w]=h;total+=h;entered++;logEvent("Job "+j.num,"Actual hrs, week ending "+fmt(w)+" ("+(SRC[j.id]||"Typed")+")","blank",h);}
    if(done){j.done=true;j.status="Complete";j.completed=w;j.actualFinish=w;j.labDone=1;j.matDone=1;j.rev[w]=Math.round(recog(j));completed.push(j);logEvent("Job "+j.num,"Status","Active","Complete");}
  });
  PC=null;
  rows.forEach(j=>{ if(j.done||j.actual[w]==null) return; const e=eac(j);
    if(e>j.proj*(1+S.set.overrun)) notify("overrun","Overrun warning: "+j.num+" "+j.customer,"On pace for "+n0(e)+" hrs against "+n0(j.proj)+" projected (+"+pct(e/j.proj-1)+"). Last week: "+n0(j.actual[w])+" hrs. Hours left: "+n0(hoursLeft(j))+".",jobTo(j),j.id);
  });
  const util=total/Math.max(1,S.set.target*S.set.hpw), utilRoster=total/Math.max(1,S.people.filter(p=>p.active).length*S.set.hpw);
  let acc=null; const f=S.fc4[w];
  if(f){ let fc=f.load, act=total; missing.forEach(id=>{fc-=(f.perJob[id]||0);}); if(fc>0) acc=Math.max(0,1-Math.abs(act-fc)/fc); }
  const prev=S.metrics[S.metrics.length-1];
  const ontime=completed.length?completed.filter(j=>w<=(j.must||j.baseFinish)).length/completed.length:prev.ontime;
  S.week=addDays(w,7); PC=null;
  S.jobs.forEach(j=>Object.keys(j.plan).forEach(k=>{if(k<S.week)delete j.plan[k];}));
  S.metrics.push({week:w,util,utilRoster,backlog:backlogWeeks(),backlogUSD:backlogUSD(),acc:acc==null?prev.acc:acc,ontime,illus:false});
  S.lastMissing=missing; S.closes++;
  logEvent("Schedule","Week closed","week ending "+fmt(w),"rolled to "+fmt(S.week));
  S.jobs.filter(j=>sold(j)&&inWindow(j,addDays(S.week,21))&&!(j.assign[addDays(S.week,21)]||[]).length).forEach(j=>fillCrew(j,addDays(S.week,21)));
  snapshot(); postDigest(); capacityCheck(); certReminders();
  LASTCLOSE={w,entered,missing:missing.length,total,alerts:S.alerts.length-before};
  SRC={}; IMPORTNOTE="";
  save(); render(); window.scrollTo(0,0);
}

function leaderRows(){

    const h=(S.hist||[]).filter(x=>x.supt===L).sort((a,b)=>b.finished.localeCompare(a.finished));
    const sum=f=>h.reduce((a,x)=>a+f(x),0);
    const est=sum(x=>x.est),act=sum(x=>x.actual),val=sum(x=>x.value);
    const fd=x=>x.value*(x.gpFinal-x.gpBid);
    const fadeUSD=sum(fd),fieldUSD=h.filter(x=>x.cause==="Field").reduce((a,x)=>a+fd(x),0);
    const live=S.jobs.filter(j=>j.supt===L&&sold(j)&&Object.keys(j.actual).length);
    return {L,h,n:h.length,hrs:est?act/est-1:0,fadeUSD,fieldUSD,fadePts:val?fadeUSD/val:0,
      over:h.filter(x=>x.actual>x.est*(1+S.set.overrun)).length,ontime:h.length?h.filter(x=>x.onTime).length/h.length:null,
      live,liveFade:live.reduce((a,j)=>a+j.value*fade(j),0)};

function createJob(){

  if(changed.includes("supt")){const oldL=S.people.find(p=>p.name===old.supt), newL=S.people.find(p=>p.name===nv.supt);Object.keys(j.assign).forEach(w=>{j.assign[w]=j.assign[w].filter(pid=>!oldL||pid!==oldL.id);if(newL&&!j.assign[w].includes(newL.id))j.assign[w].unshift(newL.id);});}
  PC=null;
  if(old.status==="Verbal"&&nv.status!=="Verbal"){weekList(30).filter(w=>inWindow(j,w)).forEach(w=>fillCrew(j,w));notify("crew","Verbal award now scheduled: "+j.num+" "+j.customer,"Counted in the forecast from "+fmt(j.start)+". Crew auto-filled for review.\nChanged by "+ROLES[S.role].name+".",jobTo(j),j.id);}
  const dmv=changed.filter(k=>k==="start"||k==="finish"||k==="must");
  if(dmv.length&&!isVerbal(j)) notify("date","Date moved: "+j.num+" "+j.customer,dmv.map(k=>labels[k]+" "+fmtN(old[k])+" → "+fmtN(nv[k])).join("\n")+(lateRisk(j)?"\nProjected finish is now after the must-finish date of "+fmt(j.must)+".":"")+"\nChanged by "+ROLES[S.role].name+".",jobTo(j),j.id);
  const cc=changed.filter(k=>k==="crew"||k==="supt");
  if(cc.length&&!isVerbal(j)) notify("crew","Crew change: "+j.num+" "+j.customer,cc.map(k=>labels[k]+" "+old[k]+" → "+nv[k]).join("\n")+"\nChanged by "+ROLES[S.role].name+".",jobTo(j),j.id);
  capacityCheck(); save();
  document.getElementById("jobdlg").close(); render();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-x]"); if(!t) return;
  if(t.dataset.tab){CUR=t.dataset.tab;if(CUR!=="close")LASTCLOSE=null;SRC={};IMPORTNOTE="";render();window.scrollTo(0,0);return;}
  if(t.dataset.lead){LEADOPEN=LEADOPEN===t.dataset.lead?null:t.dataset.lead;render();return;}
  if(t.dataset.billact){const [a,id,x]=t.dataset.billact.split("|");billAction(a,id,x);return;}
  if(t.dataset.jy){const [k,id]=t.dataset.jy.split("|");jyToggle(k,id);return;}
  if(t.dataset.job){JYOPEN=CUR==="jy";BILLOPEN=!!t.dataset.billopen;openJob(t.dataset.job,S.week);return;}
  if(t.hasAttribute("data-x")){document.getElementById("jobdlg").close();return;}
  if(t.id==="jsave"){saveJob(t.dataset.id);return;}
  if(t.dataset.woact){const [a,id]=t.dataset.woact.split("|");woAction(a,id);return;}
  const dj=jobById(document.getElementById("jobdlg").dataset.job||"");
  if(t.id==="addNote"&&dj){const tx=document.getElementById("noteText").value.trim();if(!tx)return;dj.notes=dj.notes||[];dj.notes.push({id:uid(),text:tx,who:ROLES[S.role].name,stamp:nowStamp(),pinned:document.getElementById("notePin").checked,crew:document.getElementById("noteCrew").checked});logEvent("Job "+dj.num,"Note added","—",tx.length>60?tx.slice(0,60)+"…":tx);crewChanged(dj);return;}
  if(t.dataset.pin&&dj){const n=(dj.notes||[]).find(x=>x.id===t.dataset.pin);if(n){n.pinned=!n.pinned;logEvent("Job "+dj.num,"Note "+(n.pinned?"pinned":"unpinned"),"—",n.text.length>60?n.text.slice(0,60)+"…":n.text);crewChanged(dj);}return;}
  if(t.dataset.unassign&&dj){const pid=+t.dataset.unassign;dj.assign[DLGWEEK]=(dj.assign[DLGWEEK]||[]).filter(x=>x!==pid);logEvent("Job "+dj.num,"Crew, week ending "+fmt(DLGWEEK),personById(pid).name,"removed");crewChanged(dj);return;}
  if(t.id==="addCrew"&&dj){const pid=+document.getElementById("addP").value;if(!pid)return;dj.assign[DLGWEEK]=(dj.assign[DLGWEEK]||[]).concat(pid);logEvent("Job "+dj.num,"Crew, week ending "+fmt(DLGWEEK),"added",personById(pid).name);crewChanged(dj);return;}
  if(t.id==="autoCrew"&&dj){const b=(dj.assign[DLGWEEK]||[]).length;fillCrew(dj,DLGWEEK);logEvent("Job "+dj.num,"Crew, week ending "+fmt(DLGWEEK),b+" assigned",dj.assign[DLGWEEK].length+" assigned");crewChanged(dj);return;}
  if(t.dataset.ack){S.ack[t.dataset.ack]=nowStamp();const [pid,w]=t.dataset.ack.split("|");logEvent("Crew "+personById(+pid).name,"Schedule acknowledged, week ending "+fmt(w),"unread","got it");save();render();return;}
  if(t.dataset.revview){REVVIEW=t.dataset.revview;render();return;}
  if(t.id==="newJob"){openNewJob();return;}
  if(t.id==="createJob"){createJob();return;}
  if(t.id==="sampleEst"){const f={nNum:"4291",nCust:"Valley Malt House",nLoc:"Shakopee, MN",nType:"Floor system",nVal:96500,nHrs:610,nMat:21800,nCrew:6,nStart:mon(addDays(S.week,35)),nFin:addDays(S.week,49),nAddr:"1450 Malt House Rd, Shakopee, MN",nTime:"6:30 AM",nContact:"Tom Reiter, 952-555-0148",nOrient:"Food-safety orientation, 30 min, first morning",nPPE:"Half-face respirator, knee pads, hairnets in production",nFirm:"conf"};
    Object.keys(f).forEach(k=>document.getElementById(k).value=f[k]);document.getElementById("nRep").value="LB";document.getElementById("nLead").value="Ben Schultz";document.getElementById("nEst").value="Greg Halvorsen";newJobPreview();return;}
  if(t.id==="bell"){CUR="alerts";render();window.scrollTo(0,0);return;}
  if(t.id==="reset"){if(confirm("Reset the demo to its starting data? Everything entered here is cleared.")){init(true);}return;}
  if(t.id==="confirmWeek"){S.jobs.filter(j=>own(j)&&sold(j)&&inWindow(j,S.week)).forEach(j=>{S.confirm[j.id+"|"+S.week]=true;logEvent("Job "+j.num,"Crew confirmed, week ending "+fmt(S.week),"unconfirmed","confirmed");});save();render();return;}
  if(t.id==="imp"){
    const map={};
    closeRows().forEach(j=>{if(/Granite Falls/.test(j.customer))return;const f=j.id==="j2"?1.35:(0.92+Math.random()*0.16);map[j.num]=Math.round(plannedNow(j)*f);});
    map["4999"]=24; applyImport(map,"Time-system export",["4999 (24 hrs)"]); return;}
  if(t.id==="doclose"){
    const blank=closeRows().filter(j=>document.querySelector(`[data-act="${j.id}"]`).value.trim()==="").length;
    if(blank&&!confirm(blank+" job"+(blank>1?"s have":" has")+" no hours. Close anyway? They’ll be named in Monday’s digest.")) return;
    doClose();return;}
  if(t.id==="toAdd"){
    const pid=+document.getElementById("toP").value, s=document.getElementById("toS").value, en=document.getElementById("toE").value, ty=document.getElementById("toT").value;
    if(!s||!en||en<s){alert("Pick a first day and a last day on or after it.");return;}
    S.timeoff.push({id:uid(),pid,start:s,end:en,type:ty}); PC=null;
    logEvent("Crew "+personById(pid).name,"Time off","none",fmt(s)+"–"+fmt(en)+" ("+ty+")");
    capacityCheck(); save(); render(); return;}
  if(t.dataset.delto){const to=S.timeoff.find(x=>x.id===t.dataset.delto);if(to){S.timeoff=S.timeoff.filter(x=>x!==to);logEvent("Crew "+personById(to.pid).name,"Time off removed",fmt(to.start)+"–"+fmt(to.end),"none");PC=null;capacityCheck();save();render();}return;}
  if(t.id==="digest"){postDigest();save();render();return;}
  if(t.dataset.uselab){const j=jobById(t.dataset.uselab);const nv=Math.round(suggestLab(j)*100)/100;logEvent("Job "+j.num,"Labor % complete",pct(j.labDone),pct(nv)+" (from hours)");j.labDone=nv;j.pctWeek=S.week;recordRev(j);save();render();return;}
});
document.getElementById("jobdlg").addEventListener("close",()=>{if(CUR!=="close")render();});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.act!=null){delete SRC[t.dataset.act];refreshReview();}
  if(t.closest&&t.closest("#nj")) newJobPreview();
  if(t.id==="q"){const q=t.value.toLowerCase();document.querySelectorAll("#roster tbody tr").forEach(r=>{r.hidden=q&&!r.cells[0].textContent.toLowerCase().includes(q);});}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="role"){S.role=t.value;LASTCLOSE=null;if(["lori","est","pm","sched"].includes(S.role))CUR="wo";save();render();return;}
  if(t.dataset.cause){const x=S.hist.find(h=>h.id===t.dataset.cause);if(x){const was=x.cause||"Untagged";x.cause=t.value||null;logEvent(x.num+" "+x.customer,"Overrun cause",was,t.value||"Untagged");save();render();}return;}
  if(t.dataset.schf){SCHF[t.dataset.schf]=t.value;render();return;}
  if(t.id==="cw"){const dj=jobById(document.getElementById("jobdlg").dataset.job);if(dj)openJob(dj.id,t.value);return;}
  if(t.id==="csv"&&t.files&&t.files[0]){const rd=new FileReader();rd.onload=()=>{const map={},un=[];const nums=new Set(closeRows().map(j=>j.num));
      String(rd.result).split(/\r?\n/).forEach(line=>{const c=line.split(",").map(x=>x.trim().replace(/^"|"$/g,""));if(c.length<2||isNaN(parseFloat(c[1])))return;const k=c[0].replace(/\D/g,"");if(!k)return;map[k]=(map[k]||0)+parseFloat(c[1]);});
      Object.keys(map).forEach(k=>{if(!nums.has(k))un.push(k+" ("+n0(map[k])+" hrs)");});
      applyImport(map,"CSV upload",un);};rd.readAsText(t.files[0]);t.value="";return;}
  if(t.dataset.plan){const [id,w]=t.dataset.plan.split("|");const j=jobById(id);const old=plans()[id][w];
    if(t.value===""){delete j.plan[w];} else j.plan[w]=Math.max(0,Math.round(+t.value));
    logEvent("Job "+j.num,"Planned hrs, week ending "+fmt(w),old,t.value===""?"auto":j.plan[w]);
    PC=null; capacityCheck(); save(); render(); return;}
  if(t.dataset.mat||t.dataset.lab||t.dataset.billed){
    const id=t.dataset.mat||t.dataset.lab||t.dataset.billed, j=jobById(id), v=Math.max(0,+t.value||0);
    if(t.dataset.billed){logEvent("Job "+j.num,"Billed to date",usd(j.billed),usd(v));j.billed=Math.round(v);}
    else {const k=t.dataset.mat?"matDone":"labDone", nv=Math.min(1,v/100);logEvent("Job "+j.num,(t.dataset.mat?"Materials":"Labor")+" % complete",pct(j[k]),pct(nv));j[k]=nv;j.pctWeek=S.week;recordRev(j);}
    save();render();return;}
  if(t.dataset.set==="matPolicy"){logEvent("Assumptions","Materials counted when",S.set.matPolicy,t.value);S.set.matPolicy=t.value;save();render();return;}
  if(t.dataset.set){const k=t.dataset.set;let v=+t.value;if(isNaN(v))return;if(k==="absence"||k==="overrun")v=v/100;
    if(k==="rate"){logEvent("Assumptions","Labor cost $/hr",S.set.rate,v);S.set.rate=v;S.jobs.forEach(j=>{j.mat=allocMat(j.value,j.matCost,j.est);if(Object.keys(j.rev).length)recordRev(j);});save();render();return;}
    logEvent("Assumptions",k,S.set[k],v);S.set[k]=v;PC=null;capacityCheck();save();render();return;}
  if(t.dataset.active){const p=personById(+t.dataset.active);p.active=t.checked;logEvent("Crew "+p.name,"Active",!t.checked?"yes":"no",t.checked?"yes":"no");PC=null;capacityCheck();save();render();return;}
  if(t.dataset.driver){const p=personById(+t.dataset.driver);p.driver=t.checked;logEvent("Crew "+p.name,"Driver",t.checked?"no":"yes",t.checked?"yes":"no");PC=null;save();return;}
  if(t.dataset.qual){const [pid,qq]=t.dataset.qual.split("|");const p=personById(+pid);if(t.checked){if(!p.quals.includes(qq))p.quals.push(qq);p.qexp=p.qexp||{};p.qexp[qq]=addDays(S.week,365);}else p.quals=p.quals.filter(x=>x!==qq);logEvent("Crew "+p.name,"Qualification "+qq,t.checked?"no":"yes",t.checked?"yes":"no");save();return;}
  if(t.dataset.mute){S.muted[S.role]=S.muted[S.role]||{};S.muted[S.role][t.dataset.mute]=!t.checked;save();return;}
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(CUR==="dash"||CUR==="board")render();});

/* ---------- init ---------- */
function init(fresh){
  S=(!fresh&&load())||null;
  if(!S){S=seed();PC=null;seedAssignments();seedFc4();
    const j1=S.jobs[0], pid=(j1.assign[S.week]||[]).map(personById).find(p=>p&&p.role==="Field");
    if(pid){S.crewDemo=pid.id;pid.driver=true;pid.med=addDays(S.week,26);if(!pid.quals.includes("Lift")){pid.quals.push("Lift");}pid.qexp["Lift"]=addDays(S.week,52);}
    snapshot();postDigest();capacityCheck();certReminders();S.alerts.forEach(a=>{a.stamp="Mon 6:00 AM";});save();}
  const cm=personById(S.crewDemo); if(cm) ROLES.crew={name:cm.name,label:"Crew: "+cm.name};
  LASTCLOSE=null; SRC={}; IMPORTNOTE=""; CUR=TABS.find(t=>t.roles.includes(S.role)).id;
  document.getElementById("role").innerHTML=Object.keys(ROLES).map(k=>`<option value="${k}" ${k===S.role?"selected":""}>${ROLES[k].label}</option>`).join("");
  render();
}
init(false);
})();
</script>
