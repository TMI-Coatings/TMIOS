# Production builds talk to Supabase; deploy previews and branch deploys run on sample data
# so they can be shared before Veracity signs off. Supabase URL and anon key are set in the
# Netlify UI (Site configuration > Environment variables), never in this file (hard rule 3).

[build]
  # The mode check refuses a production build in demo mode unless ALLOW_DEMO_IN_PRODUCTION=yes.
  command = "node scripts/check-build-mode.mjs && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview]
  command = "npm run build:sample"

[context.branch-deploy]
  command = "npm run build:sample"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
